services:
  turn:
    image: ${TURN_IMAGE:-coturn/coturn:4.6.2}
    labels:
      com.wrd.turn-loss-fixture: "true"
      com.wrd.turn-loss-run-id: ${RUN_ID:?RUN_ID is required}
    networks: [turn-loss]
    ports:
      - "127.0.0.1:${TURN_LISTEN_PORT:?TURN_LISTEN_PORT is required}:3478/udp"
    command:
      - -n
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --min-port=51000
      - --max-port=51009
      - --lt-cred-mech
      - --no-cli
      - --no-tcp-relay
      - --no-tls
      - --no-dtls
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  loss-controller:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-alpine
        RUN apk add --no-cache iptables
        WORKDIR /fixture
        COPY controller.py /fixture/controller.py
        CMD ["sleep", "infinity"]
    labels:
      com.wrd.turn-loss-fixture: "true"
      com.wrd.turn-loss-run-id: ${RUN_ID:?RUN_ID is required}
    network_mode: service:turn
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./runtime:/runtime:ro

networks:
  turn-loss:
    name: turn-loss-${RUN_ID:?RUN_ID is required}
    internal: true
