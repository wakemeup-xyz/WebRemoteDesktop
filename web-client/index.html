<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeHarness学习助手 - 登录</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <h1>CodeHarness学习助手</h1>
    <form id="loginForm">
      <div class="input-group">
        <label for="password">访问密码</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password"
               placeholder="请输入访问密码">
      </div>
      <button type="submit">连接</button>
      <div id="error" class="error-message" role="alert" aria-live="polite"></div>
    </form>
  </div>

  <!-- WRD_BUILD_LOGIN_SCRIPTS_START -->
  <script src="js/runtime-config.js"></script>
  <script src="js/bounded-request.js"></script>
  <script src="js/login.js"></script>
  <!-- WRD_BUILD_LOGIN_SCRIPTS_END -->
</body>
</html>
